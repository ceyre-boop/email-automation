services:
  - type: web
    name: email-automation
    env: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_SHEETS_REFRESH_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: AGENCY_SECRET_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL   # optional — Slack-compatible alert webhook
        sync: false
      - key: TELEGRAM_BOT_TOKEN  # optional — Telegram bot alerts (needs TELEGRAM_CHAT_ID too)
        sync: false
      - key: TELEGRAM_CHAT_ID    # optional — Telegram chat to alert
        sync: false
      - key: HEARTBEAT_URL       # optional — healthchecks.io-style ping after each good poll
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: cron
    name: poller-heartbeat
    env: python
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install requests
    startCommand: python scripts/heartbeat.py
    envVars:
      - key: APP_BASE_URL
        sync: false
      - key: API_KEY
        sync: false
